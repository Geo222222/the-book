[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "the-book"
version = "0.1.0"
description = "Sovereign evidence and provenance kernel for the Benjamin ecosystem"
requires-python = ">=3.11"
dependencies = ["cryptography>=43"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
